# pnpm 10+ blocks dependency install/postinstall scripts by default. This list
# allows the dependencies that actually ran build scripts under pnpm 9 (sqlite3
# is a native module required for packaging; the rest keep behavior unchanged).
allowBuilds:
  electron-winstaller: true
  msgpackr-extract: true
  opencode-ai: true
  protobufjs: true
  sqlite3: true

# The Claude and Codex ACP bridges pull the native Claude Code / Codex CLI as
# platform-specific optional packages (~550 MB per host). Wanta never uses them:
# the bridges always receive the user's own CLI through CLAUDE_CODE_EXECUTABLE /
# CODEX_PATH, and packaged builds ship only the bridge JS (see
# scripts/prepare-binaries.ts and electron/agent/acp/registry.ts). Skip the
# download so the dev tree stays free of agent binaries.
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl"
  - "@anthropic-ai/claude-agent-sdk-linux-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64"
  - "@anthropic-ai/claude-agent-sdk-win32-x64"
  - "@openai/codex-darwin-arm64"
  - "@openai/codex-darwin-x64"
  - "@openai/codex-linux-arm64"
  - "@openai/codex-linux-x64"
  - "@openai/codex-win32-arm64"
  - "@openai/codex-win32-x64"

patchedDependencies:
  wiki-graph-core@0.6.0: patches/wiki-graph-core@0.6.0.patch
  wiki-graph@0.6.0: patches/wiki-graph@0.6.0.patch

# Keep the bridges' runtime libraries on audited stable releases. Native CLI
# binaries remain external and are still excluded above.
overrides:
  "@agentclientprotocol/claude-agent-acp>@anthropic-ai/claude-agent-sdk": "0.3.268"
  "@agentclientprotocol/codex-acp>@openai/codex": "0.154.0"

# Explicitly requested latest stable SDK; keep the age exception version-scoped.
minimumReleaseAgeExclude:
  - "@anthropic-ai/claude-agent-sdk@0.3.268"
